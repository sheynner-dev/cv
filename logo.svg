<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Logo Sheynner - S Tech</title>
  <desc id="desc">Logo con la letra S en estilo tecnológico y gradiente azul</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"></stop>
      <stop offset="100%" stop-color="#06B6D4"></stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00C2FF" flood-opacity="0.5"></feDropShadow>
    </filter>
  </defs>

  <rect width="240" height="240" rx="28" fill="#0F172A"></rect>
  
  <!-- Letra S con efecto tech -->
  <g filter="url(#glow)">
    <path d="M60 70c28-30 120-30 120 6 0 34-56 52-80 78-20 22-30 44 6 44" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <!-- Circuitos decorativos -->
  <circle cx="55" cy="60" r="5" fill="#06B6D4"></circle>
  <circle cx="180" cy="160" r="5" fill="#06B6D4"></circle>
  <line x1="65" y1="60" x2="100" y2="80" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"></line>
  <line x1="150" y1="150" x2="180" y2="160" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"></line>

  <!-- Texto opcional -->
  <text x="50%" y="210" text-anchor="middle" fill="#94A3B8" font-family="Poppins, sans-serif" font-size="14">
    Sheynner Dev
  </text>
</svg>
